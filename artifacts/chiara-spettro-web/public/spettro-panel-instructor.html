<style>
*{box-sizing:border-box}
:root{
--bg:#0a0a10;--bg2:#10101a;--panel:#14141f;--panel2:#191926;--line:#26263a;--line2:#33334a;
--txt:#e8e8f2;--dim:#9a9ab0;--faint:#6a6a80;
--acc:#ff3d8b;--violet:#8b5cf6;--cyan:#39c7e0;--ok:#3ddc97;--warn:#f5b83d;--bad:#ff5c5c;
--mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;

html,body{margin:0}
body{background:radial-gradient(1200px 500px at 70% -10%,rgba(139,92,246,.12),transparent 60%),radial-gradient(900px 400px at 10% 110%,rgba(255,61,139,.10),transparent 55%),var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
::selection{background:rgba(255,61,139,.35)}
a{color:var(--cyan)}
code{background:#1a1a28;padding:2px 6px;border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--cyan)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26263a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;height:58px;background:rgba(10,10,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.logo b{color:var(--acc)}
.caret{animation:blink 1.1s steps(1) infinite;color:var(--acc);margin-left:2px}
@keyframes blink{50%{opacity:0}}
.tagline{font-size:10px;color:var(--faint);letter-spacing:2px;margin-left:10px;font-family:var(--mono);border:1px solid var(--line2);padding:3px 8px;border-radius:6px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.saved{font-size:11px;color:var(--faint);font-family:var(--mono)}
.sel-role{width:auto;padding:7px 10px;font-family:var(--mono);font-size:12px;background:#0d0d15;border:1px solid rgba(139,92,246,.45);border-radius:8px;color:var(--txt)}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);align-items:start}
nav#sidenav{border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;min-width:0}
.nav-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--dim);cursor:pointer;font-size:14px;margin-bottom:4px;user-select:none}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.active{color:var(--acc);background:rgba(255,61,139,.08)}
.ni{width:20px;text-align:center}
.navcount{margin-left:auto;background:#1c1c2a;color:var(--dim);padding:1px 8px;border-radius:99px;font-family:var(--mono);font-size:11px}
.side-note{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:11px;color:var(--faint);line-height:1.7}
main{padding:26px 30px;max-width:1180px;width:100%;margin:0 auto;min-width:0}
.page-title{font-family:var(--mono);font-size:22px;margin:0 0 6px;letter-spacing:.5px}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 18px;line-height:1.6}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head .page-title{margin-bottom:4px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.stat .num{font-size:26px;font-family:var(--mono);color:var(--acc);font-weight:700}
.stat .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--rad);padding:18px}
.card-h{font-family:var(--mono);font-size:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:16px}
.stack-sm>*+*{margin-top:8px}
.btn{font-family:var(--mono);font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.primary:hover{background:#ff5d9d;color:#fff;box-shadow:0 4px 18px rgba(255,61,139,.35)}
.btn.danger{color:var(--bad);border-color:rgba(255,92,92,.45);background:transparent}
.btn.danger:hover{background:rgba(255,92,92,.12);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 16px;color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;user-select:none}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--acc);border-color:var(--acc)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono);vertical-align:middle}
.badge.ok{color:var(--ok);border-color:rgba(61,220,151,.4)}
.badge.warn{color:var(--warn);border-color:rgba(245,184,61,.4)}
.badge.acc{color:var(--acc);border-color:rgba(255,61,139,.4)}
.badge.ko{color:var(--bad);border-color:rgba(255,92,92,.4)}
.badge.vio{color:#c4b5fd;border-color:rgba(139,92,246,.55)}
.logline{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.logline:last-child{border-bottom:0}
.logline:hover{background:rgba(255,255,255,.02)}
.log-ts{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;min-width:112px;padding-top:2px}
.log-who{font-family:var(--mono);font-size:11px;color:#c4b5fd;white-space:nowrap;padding-top:2px}
.log-tx{flex:1;color:var(--dim);line-height:1.55;min-width:0}
.log-tx b{color:var(--txt)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.grid2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.grid2>*{min-width:0}
.grid-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.inrow{display:flex;gap:8px}
.inrow .inp{flex:1}
label{display:block;font-size:11px;color:#b9a8f5;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.8px;font-family:var(--mono)}
.inp{width:100%;background:#0d0d15;border:1px solid rgba(139,92,246,.45);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.6}
select.inp{appearance:auto}
fieldset{border:0;padding:0;margin:0;min-width:0}
.lesson-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;margin-bottom:8px}

.lt{min-width:0;flex:1}
.lt-t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.hint{font-size:12px;color:var(--faint);line-height:1.7;margin:8px 0 0}
.guide{margin:6px 0 0;padding-left:20px;color:var(--dim);font-size:13.5px;line-height:1.9}

.empty{padding:36px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:10px;font-size:14px}
.readonly-note{border:1px solid rgba(245,184,61,.4);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;background:rgba(245,184,61,.06)}
#vidPrev{margin-top:4px}

.vidbox{border:1px dashed var(--line2);border-radius:10px;padding:34px 16px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:13px}
.vidbox.bad{color:var(--warn);border-color:rgba(245,184,61,.4)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qopt{display:flex;align-items:center;gap:10px;margin-top:8px}
.qopt input[type=radio]{accent-color:var(--acc);width:16px;height:16px;flex:none}
.qopt .inp{flex:1}
.pts{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim);text-transform:none;margin:0}
.pts-inp{width:64px;padding:6px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);cursor:pointer}
.chip.sel{border-color:var(--acc);color:var(--acc)}
.qa{display:block;width:100%;text-align:left;padding:10px 13px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--txt);cursor:pointer;margin-top:8px;font-family:inherit;font-size:14px}
.qa:hover{border-color:var(--acc)}
.qa.sel{border-color:var(--acc);background:rgba(255,61,139,.12)}
.qa.ok{border-color:var(--ok);color:var(--ok)}
.qa.ko{border-color:var(--bad);color:var(--bad)}
.qa.static{cursor:default}
.big-score{font-size:42px;font-family:var(--mono);color:var(--acc);font-weight:700;margin:8px 0}
.res-ok{border-color:rgba(61,220,151,.5)}
.res-ko{border-color:rgba(255,92,92,.5)}
.progress{height:8px;background:#1c1c2a;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--violet))}
.prev-top{display:flex;gap:14px;align-items:center;margin:8px 0 16px;flex-wrap:wrap}
.modal-ov{position:fixed;inset:0;background:rgba(5,5,10,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:85vh;overflow:auto}
[hidden]{display:none!important}
.toast{position:fixed;bottom:22px;right:22px;background:var(--panel);border:1px solid var(--ok);color:var(--ok);padding:12px 18px;border-radius:10px;font-family:var(--mono);font-size:13px;z-index:120;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:70vw}
.toast.show{opacity:1;transform:none}
.cc-head{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.cc-num{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acc);border:1px solid rgba(255,61,139,.4);border-radius:10px;padding:8px 13px;background:rgba(255,61,139,.08);flex:none}
.modrow{margin-bottom:8px}
.modrow .idx{font-family:var(--mono);color:var(--acc);font-weight:700;min-width:26px;text-align:right;flex:none}
.modrow .inp{flex:1}
@media(max-width:920px){
.app{grid-template-columns:1fr}
nav#sidenav{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
.nav-item{white-space:nowrap;margin-bottom:0}
.side-note{display:none}
.grid2{grid-template-columns:1fr}
main{padding:16px}
}
@media(max-width:560px){
.statgrid{grid-template-columns:repeat(2,1fr)}
.topbar{padding:8px 10px;gap:8px;flex-wrap:wrap;height:auto;min-height:58px}
.tagline{display:none}
.logo{font-size:15px}
.saved{display:none}
.sel-role{max-width:52vw;font-size:11px;padding:6px 8px}
main{padding:12px}
.card{padding:14px}
}
</style>

function download(name,content,mime){const b=new Blob([content],{type:mime||'application/octet-stream'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)}

/* convierte un enlace de video en reproductor integrado */
function embed(url){
  if(!url)return null;
  const u=String(url).trim();let m;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/))return{type:'iframe',src:'https://www.youtube.com/embed/'+m[1]};
  if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{type:'iframe',src:'https://player.vimeo.com/video/'+m[1]};
  if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/))return{type:'iframe',src:'https://drive.google.com/file/d/'+m[1]+'/preview'};
  if(/\.(mp4|webm|ogg|m4v)(\?.*)?$/i.test(u))return{type:'video',src:u};
  if(/^https?:\/\//i.test(u))return{type:'iframe',src:u};
  return{type:'bad'};
}
function videoBox(url){
  if(!url)return '<div class="vidbox">🎬 Pega arriba el enlace del video (YouTube, Vimeo, Google Drive o MP4) y se previsualiza aquí.</div>';
  const e=embed(url);
  if(!e||e.type==='bad')return '<div class="vidbox bad">⚠ Enlace no reconocido. Copia la URL completa desde el navegador (ej. https://www.youtube.com/watch?v=…).</div>';

/* ============ reconocimiento del curso ============ */
function tStruct(c,can){
  const conVideo=c.lessons.filter(l=>l.video_url).length;
  const conNotas=c.lessons.filter(l=>l.notes).length;
  const nPreg=c.quizzes.reduce((a,q)=>a+q.questions.length,0);
  const sinPreg=c.quizzes.filter(q=>!q.questions.length).length;
  const pend=[];
  if(!c.lessons.length)pend.push('No hay temas todavía: pulsa «＋ Nuevo tema»');
  if(c.lessons.length&&conVideo<c.lessons.length)pend.push((c.lessons.length-conVideo)+' tema(s) sin enlace de video');
  if(c.lessons.length&&conNotas<c.lessons.length)pend.push((c.lessons.length-conNotas)+' tema(s) sin notas');
  if(!c.quizzes.length)pend.push('No hay exámenes: pulsa «＋ Nuevo examen»');
  if(sinPreg)pend.push(sinPreg+' examen(es) sin preguntas');
  if(!c.published)pend.push('El curso está en borrador (no publicado)');
  return '<div class="stack">'+
  '<div class="card"><div class="card-h">🧭 Reconocimiento — lo que ya tienes subido</div>'+
  '<p class="hint">Tu curso enumerado en el orden en que lo creaste (Tema 01, 02… y Examen 01, 02…). Desde aquí pasas a crear nuevos temas y exámenes.</p>'+
  '<div class="statgrid" style="margin-top:14px">'+statCard(c.lessons.length,'Temas')+statCard(conVideo+' / '+c.lessons.length,'Con video')+statCard(c.quizzes.length,'Exámenes')+statCard(nPreg,'Preguntas')+statCard(c.lessons.filter(l=>l.material_url).length,'Materiales')+'</div>'+
  '<div class="row-btns" style="margin-top:16px"><button class="btn primary" data-act="course-add-lesson" data-arg="'+c.id+'"'+(can?'':' disabled')+'>＋ Nuevo tema</button><button class="btn primary" data-act="course-add-quiz" data-arg="'+c.id+'"'+(can?'':' disabled')+'>＋ Nuevo examen</button><button class="btn" data-act="tab" data-arg="prev">▶ Ver como alumno</button></div>'+
  '</div>'+
  '<div class="card"><div class="card-h">📚 Temas ('+c.lessons.length+') <span class="hint" style="margin:0">pulsa uno para editar su video</span></div>'+
  (c.lessons.length?c.lessons.map((l,i)=>'<div class="lesson-row" data-act="struct-lesson" data-arg="'+l.id+'"><span class="idx">T'+pad2(i+1)+'</span><div class="lt"><div class="lt-t">'+esc(l.title||'(sin título)')+'</div><div class="ld">'+esc(l.duration||'--:--')+' · '+(l.video_url?'🎬 video ✓':'⚠ sin video')+(l.notes?'':' · ⚠ sin notas')+(l.material_url?' · 📎 material':'')+'</div></div><span class="badge '+(l.video_url?'ok':'warn')+'">'+(l.video_url?'listo':'pendiente')+'</span></div>').join(''):'<div class="empty">Aún no hay temas. Pulsa «＋ Nuevo tema» y pega el video.</div>')+
  '</div>'+
  '<div class="card"><div class="card-h">❓ Exámenes ('+c.quizzes.length+') <span class="hint" style="margin:0">pulsa uno para editar sus preguntas</span></div>'+
  (c.quizzes.length?c.quizzes.map((q,i)=>'<div class="lesson-row" data-act="struct-quiz" data-arg="'+q.id+'"><span class="idx">E'+pad2(i+1)+'</span><div class="lt"><div class="lt-t">'+esc(q.title||'(sin título)')+'</div><div class="ld">'+q.questions.length+' preguntas · aprueba con '+q.passing_pct+'%</div></div><span class="badge '+(q.questions.length?'ok':'warn')+'">'+(q.questions.length?'listo':'pendiente')+'</span></div>').join(''):'<div class="empty">Aún no hay exámenes. Pulsa «＋ Nuevo examen».</div>')+
  '</div>'+
  '<div class="card '+(pend.length?'res-ko':'res-ok')+'"><div class="card-h">'+(pend.length?'🛠 Preparación pendiente':'✅ Todo listo')+'</div>'+
  (pend.length?'<ul class="guide" style="margin:0">'+pend.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':'<p class="hint" style="margin:0">Temas con video, exámenes con preguntas y curso publicado. 🎯</p>')+
  '</div>'+

function prevQuiz(c,quiz){
  const p=pv();
  if(!quiz)return '<div class="empty">Este curso aún no tiene exámenes de aprendizaje. Créalo en la pestaña «Exámenes».</div>';
  const tot=quiz.questions.reduce((a,q)=>a+(+q.points||0),0);
  let html='';
  if(c.quizzes.length>1)html+='<div class="chips">'+c.quizzes.map(q=>'<button class="chip '+(q.id===quiz.id?'sel':'')+'" data-act="prev-quiz" data-arg="'+q.id+'">'+esc(q.title)+'</button>').join('')+'</div>';
  if(!p.started||p.qid!==quiz.id){p.qid=quiz.id;p.started=false;p.done=false;p.answers={};
    return html+'<div class="card"><div class="card-h">❓ '+esc(quiz.title)+'</div><p class="hint" style="margin:0 0 14px">Examen de aprendizaje del curso: '+quiz.questions.length+' preguntas · '+tot+' puntos · necesitas <b>'+quiz.passing_pct+'%</b> para aprobar.</p><button class="btn primary" data-act="quiz-start">✍️ Comenzar examen</button></div>';
  }
  if(p.done)return html+prevResults(quiz);
  const ans=Object.keys(p.answers).length;
  return html+quiz.questions.map((q,i)=>'<div class="qcard"><div class="qhead"><b>'+(i+1)+'. '+esc(q.text||'(sin pregunta)')+'</b><span class="badge">'+(+q.points||10)+' pts</span></div>'+
    q.opts.map((o,oi)=>'<button class="qa '+(p.answers[q.id]===oi?'sel':'')+'" data-act="quiz-answer" data-arg="'+q.id+'|'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</button>').join('')+
    '</div>').join('')+
    '<div style="margin-top:16px"><button class="btn primary" data-act="quiz-finish"'+(ans<quiz.questions.length?' disabled':'')+'>✅ Finalizar y ver nota</button>'+
    '<p class="hint">Respondidas '+ans+' de '+quiz.questions.length+'.</p></div>';
}
function quizScore(quiz,answers){
  let got=0,tot=0;
  quiz.questions.forEach(q=>{tot+=(+q.points||0);if(answers[q.id]===q.correct)got+=(+q.points||0)});
  const pct=tot?Math.round(got/tot*100):0;
  return{got:got,tot:tot,pct:pct,pass:pct>=(+quiz.passing_pct||70)};
}
function prevResults(quiz){
  const s=quizScore(quiz,pv().answers);
  return '<div class="card '+(s.pass?'res-ok':'res-ko')+'"><div class="card-h">'+(s.pass?'✅ ¡Examen superado!':'❌ Examen no superado')+'</div>'+
  '<div class="big-score">'+s.pct+'%</div>'+
  '<p class="hint" style="margin:0 0 14px">'+s.got+' de '+s.tot+' puntos · nota mínima '+quiz.passing_pct+'%</p>'+
  '<div class="row-btns"><button class="btn primary" data-act="quiz-retry">🔁 Reintentar</button></div></div>'+
  '<div class="stack" style="margin-top:16px">'+
  quiz.questions.map((q,i)=>{const sel=pv().answers[q.id];
    return '<div class="qcard"><div class="qhead"><b>'+(i+1)+'. '+esc(q.text)+'</b>'+(sel===q.correct?badge('correcta','ok'):badge('fallada','ko'))+'</div>'+
    q.opts.map((o,oi)=>'<div class="qa static '+(q.correct===oi?'ok':(sel===oi?'ko':''))+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+(q.correct===oi?' ✓':'')+'</div>').join('')+
    '</div>'}).join('')+
  '</div>';
}

  'quiz-optdel':a=>{
    const c=getCourse(state.courseId);if(!c||!guard(c))return;

    const[id,oi]=a.split('|');const q=qz.questions.find(x=>x.id===id);if(!q||q.opts.length<=2)return;
    const k=+oi;q.opts.splice(k,1);
    if(q.correct===k)q.correct=0;else if(q.correct>k)q.correct=q.correct-1;
    c.updated=Date.now();saveNow();render();
  },
  'quiz-export':a=>{
    const[id1,id2]=a.split('|');
    const c=getCourse(id2?id1:state.courseId);const qz=getQuiz(c?id1:state.courseId,id2||id1);
    if(!c||!qz)return;
    download('prueba-'+slugify(qz.title)+'.json',JSON.stringify({title:qz.title,passing_pct:+qz.passing_pct||70,questions:qz.questions.map(q=>({text:q.text,options:q.opts,correct:q.correct,points:+q.points||10}))},null,2),'application/json');
    toast('📤 Prueba exportada en JSON');
  },
  'quiz-import':()=>{const c=getCourse(state.courseId);if(!c||!guard(c))return;document.getElementById('fileQuiz').click()},
  'quiz-edit':a=>{const[cid,qid]=a.split('|');if(!getCourse(cid))return;state.view='course';state.courseId=cid;state.tab='quiz';state.quizId=qid;state.lessonId=null;state.preview=null;render()},
  'quiz-preview':a=>{const[cid,qid]=a.split('|');const c=getCourse(cid);if(!c)return;state.view='course';state.courseId=cid;state.tab='prev';state.lessonId=null;state.preview=null;render();state.preview.qid=qid;state.preview.tab='quiz';render()},
  'prev-lesson':id=>{const p=state.preview;if(!p)return;p.lessonId=id;p.tab='lesson';render()},
  'prev-tab':a=>{const p=state.preview;if(!p)return;p.tab=a;render()},
  'prev-quiz':id=>{const p=state.preview;if(!p)return;p.qid=id;p.started=false;p.done=false;p.answers={};render()},
  's-open':id=>{
    const c=getCourse(id);
    if(!c||!c.published){toast('⛔ Ese curso no está publicado');return}
    state.view='scourse';
    state.sp={courseId:id,lessonId:c.lessons[0]?c.lessons[0].id:null,tab:'lesson',qid:c.quizzes[0]?c.quizzes[0].id:null,started:false,done:false,answers:{}};
    render();
  },
  's-lesson':id=>{if(!state.sp)return;state.sp.lessonId=id;state.sp.tab='lesson';render()},
  's-tab':a=>{if(!state.sp)return;state.sp.tab=a;render()},
  's-complete':id=>{
    if(!state.sp)return;
    const key=progKey(state.sp.courseId);
    const rec=DB.progress[key]||(DB.progress[key]={completed:[],attempts:[]});
    if(!Array.isArray(rec.completed))rec.completed=[];
    const i=rec.completed.indexOf(id);
    const cc=getCourse(state.sp.courseId);
    if(cc){
      const li=cc.lessons.findIndex(x=>x.id===id);
      if(li>=0)logAct(i>=0?'↩':'🎓',state.sname+(i>=0?' quitó la marca del tema T'+pad2(li+1)+' — «'+cc.lessons[li].title+'»':' completó el tema T'+pad2(li+1)+' — «'+cc.lessons[li].title+'» de «'+cc.title+'»'),cc.id);
    }
    if(i>=0){rec.completed.splice(i,1);toast('↩ Marca de completado quitada')}
    else{rec.completed.push(id);toast('✅ Tema completado — ¡sigue así!')}
    saveNow();render();
  },
  'quiz-start':()=>{const p=pv();if(!p)return;p.started=true;p.done=false;p.answers={};render()},
  'quiz-answer':a=>{const p=pv();if(!p)return;const[qid,oi]=a.split('|');p.answers[qid]=+oi;render()},
  'quiz-finish':()=>{
    const p=pv();if(!p)return;
    p.done=true;
    if(state.role==='alumno'){
      const c=getCourse(p.courseId),q=getQuiz(p.courseId,p.qid);
      if(c&&q){
        const s=quizScore(q,p.answers);
        const key=progKey(c.id);
        const rec=DB.progress[key]||(DB.progress[key]={completed:[],attempts:[]});
        if(!Array.isArray(rec.attempts))rec.attempts=[];
        rec.attempts.push({qid:q.id,title:q.title,score:s.pct,passed:s.pass,date:Date.now()});
        logAct('🧪',state.sname+' hizo el examen «'+q.title+'» de «'+c.title+'»: '+s.pct+'% '+(s.pass?'— APROBADO ✅':'— no aprobado'),c.id);
        saveNow();
        toast(s.pass?'✅ Examen superado: '+s.pct+'% 🎉':'❌ '+s.pct+'% — necesitas '+q.passing_pct+'%, puedes reintentarlo');
      }
    }
    render();
  },
  'quiz-retry':()=>{const p=pv();if(!p)return;p.started=true;p.done=false;p.answers={};render()},
  'data-export':()=>{logAct('💾','Descargó una copia de seguridad (JSON) con '+DB.courses.length+' cursos');saveNow();download('spettro-backup.json',JSON.stringify(DB,null,2),'application/json');toast('⬇️ Copia descargada')},
  'data-import':()=>{document.getElementById('fileAll').click()},
  'data-exportjs':()=>{
    logAct('🧩','Generó spettro-contenido.js para integrar los cursos en la web');saveNow();
    const js='// Generado por el Panel de Control de SpettroWeb ('+new Date().toISOString()+')\n// Cárgalo antes de tu app y lee window.SPETTRO_DATA.courses\nwindow.SPETTRO_DATA='+JSON.stringify(DB,null,2)+';\n';
    download('spettro-contenido.js',js,'text/javascript');toast('🧩 Archivo de integración descargado');
  },
  'data-seed':()=>confirmModal('Restaurar datos de ejemplo','Se reemplazará TODO lo que hay ahora por los 2 cursos de ejemplo. Si quieres conservarlos, antes descarga una copia en JSON.',()=>{DB=seed();saveNow();state.view='dash';state.courseId=null;render();toast('👻 Datos de ejemplo restaurados')}),
  'data-clear':()=>confirmModal('Borrar todo','Se eliminarán todos los cursos, temas y exámenes guardados en este navegador. Esta acción no se puede deshacer.',()=>{DB={version:1,updated:Date.now(),progress:{},log:[],courses:[]};logAct('🗑','Borró todos los datos del panel');saveNow();state.view='dash';state.courseId=null;render();toast('🗑 Datos borrados')})
};
/* ============ importación de archivos ============ */
function handleAllImport(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let d=null;try{d=JSON.parse(r.result)}catch(e){d=null}
    if(!d||!Array.isArray(d.courses)){toast('⚠ Archivo JSON no válido');return}
    d.log=Array.isArray(d.log)?d.log:[];
    DB=d;
    logAct('📦','Importó una copia de seguridad ('+DB.courses.length+' cursos)',null);
    saveNow();state.view='dash';state.courseId=null;render();toast('📦 Copia importada ('+DB.courses.length+' cursos)');
  };
  r.readAsText(file);
}
function handleQuizImport(file){
  if(!file)return;
  const c=getCourse(state.courseId);
  if(!c||!guard(c))return;
  const r=new FileReader();
  r.onload=()=>{
    let d=null;try{d=JSON.parse(r.result)}catch(e){d=null}
    const qs=d&&Array.isArray(d.questions)?d.questions:null;
    if(!qs){toast('⚠ Formato esperado: {"title":…,"passing_pct":…,"questions":[{"text","options","correct","points"}]}');return}
    const q={id:uid('q'),title:d.title||file.name.replace(/\.json$/i,''),passing_pct:+d.passing_pct||70,
      questions:qs.map(x=>({id:uid('p'),text:String(x.text||''),opts:(x.options||x.opts||['','','']).map(String),correct:Math.max(0,Math.min((x.options||x.opts||[]).length-1,+(x.correct||0))),points:+x.points||10}))};
    c.quizzes.push(q);c.updated=Date.now();
    logAct('📥','Importó el examen «'+q.title+'» ('+q.questions.length+' preguntas) en «'+c.title+'»',c.id);
    saveNow();state.tab='quiz';state.quizId=q.id;render();toast('📥 Prueba «'+q.title+'» importada');
  };
  r.readAsText(file);
}
/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const f=ACTIONS[el.dataset.act];
  if(f)f(el.dataset.arg,el);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el.matches('[data-f]')||el.disabled)return;
  let v=el.value;
  if(el.type==='number')v=+v;
  setField(el.dataset.f,v);
  if(el.dataset.f==='lesson.video_url'){const vp=document.getElementById('vidPrev');if(vp)vp.innerHTML=videoBox(v)}
  if(el.dataset.f==='course.demo_url'){const dp=document.getElementById('demoPrev');if(dp)dp.innerHTML=videoBox(v)}
  if(el.dataset.f==='quiz.passing_pct'){const pv=document.getElementById('ppVal');if(pv)pv.textContent=v+'%'}
  saveSoon();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fileAll'){handleAllImport(el.files[0]);el.value='';return}
  if(el.id==='fileQuiz'){handleQuizImport(el.files[0]);el.value='';return}
  if(el.id==='roleSel'){state.role=el.value;state.courseId=null;state.preview=null;state.sp=null;state.view=state.role==='alumno'?'shome':'dash';render();toast('👤 Sesión: '+(state.role==='admin'?'👑 Admin — '+ROLES.admin.name:state.role==='inst'?'🧑‍🏫 Instructor — '+ROLES.inst.name:'👨‍🎓 Alumno — '+state.sname));return}
  if(el.matches('[data-f]')){
    if(el.type==='checkbox')setField(el.dataset.f,el.checked);
    else if(el.type==='radio')setField(el.dataset.f,+el.value);
    else setField(el.dataset.f,el.type==='number'?+el.value:el.value);
    saveNow();
    if(el.dataset.rerender)render();
  }
});
function setField(path,v){
  const seg=path.split('.');
  if(seg[0]==='sname'){state.sname=String(v).trim()||'alumno';return}
  if(seg[0]==='upload'){if(state.upload)state.upload[seg[1]]=v;return}
  if(seg[0]==='module'){if(state.upload)state.upload.modules[+seg[1]]=v;return}
  const c=getCourse(state.courseId);
  if(!c)return;
  if(seg[0]==='course'){c[seg[1]]=v;c.updated=Date.now();return}
  if(seg[0]==='lesson'){const l=getLesson(c.id,state.lessonId);if(l)l[seg[1]]=v;return}
  if(seg[0]==='quiz'){const q=getQuiz(c.id,state.quizId);if(q)q[seg[1]]=v;return}
  if(seg[0]==='q'){
    const qz=getQuiz(c.id,state.quizId);if(!qz)return;
    const q=qz.questions.find(x=>x.id===seg[1]);if(!q)return;
    if(seg[2]==='opt')q.opts[+seg[3]]=v;
    else if(seg[2]==='correct')q.correct=v;
    else q[seg[2]]=v;
  }
}
/* ============ inicio ============ */
document.getElementById('roleSel').value=state.role;
render();
if(FIRST_RUN)toast('👻 Datos de ejemplo cargados — personalízalos a tu gusto');
</script>
